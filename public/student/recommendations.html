<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recommended Drives | College Placement Tracker</title>
  <link rel="stylesheet" href="/css/style.css">
  <script>
    if (localStorage.getItem('role') !== 'student') {
      window.location.replace('/login.html');
    }
  </script>
  <script src="/js/api.js" defer></script>
  <script src="/student/student.js" defer></script>
</head>
<body>
  <main class="admin-shell" data-page="recommendations">
    <header class="admin-header">
      <div><p class="eyebrow">College Placement Tracker</p><h1>Recommended Drives</h1></div>
      <button class="button-secondary" type="button" data-logout>Log out</button>
    </header>
    <nav class="admin-nav" aria-label="Student pages">
      <a href="/student/dashboard.html">Dashboard</a>
      <a href="/student/profile.html">My profile</a>
      <a href="/student/drives.html">Placement drives</a>
      <a href="/student/recommendations.html" aria-current="page">Recommended</a>
      <a href="/student/applications.html">My applications</a>
    </nav>

    <section class="content-panel">
      <div class="section-heading">
        <div><h2>Best matches for you</h2><p class="muted">Drives are ranked by your match score.</p></div>
        <button id="refresh-recommendations" class="button-secondary" type="button">Refresh</button>
      </div>
      <p id="page-message" class="message" role="status" aria-live="polite"></p>
      <div class="table-wrap">
        <table class="admin-table">
          <thead>
            <tr><th>Rank</th><th>Company</th><th>Match score</th><th>Why it matches</th><th>Action</th></tr>
          </thead>
          <tbody id="recommendations-table"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
