<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Profile | College Placement Tracker</title>
  <link rel="stylesheet" href="/css/style.css">
  <script>
    if (localStorage.getItem('role') !== 'student') {
      window.location.replace('/login.html');
    }
  </script>
  <script src="/js/api.js" defer></script>
  <script src="/student/student.js" defer></script>
</head>
<body>
  <main class="admin-shell" data-page="profile">
    <header class="admin-header">
      <div><p class="eyebrow">College Placement Tracker</p><h1>My Profile</h1></div>
      <button class="button-secondary" type="button" data-logout>Log out</button>
    </header>
    <nav class="admin-nav" aria-label="Student pages">
      <a href="/student/dashboard.html">Dashboard</a>
      <a href="/student/profile.html" aria-current="page">My profile</a>
      <a href="/student/drives.html">Placement drives</a>
      <a href="/student/recommendations.html">Recommended</a>
      <a href="/student/applications.html">My applications</a>
    </nav>

    <section class="content-panel">
      <h2>Your details</h2>
      <form id="profile-form" class="form-grid">
        <label for="profile-name">Name</label>
        <input id="profile-name" name="name" type="text" maxlength="150" required>
        <label for="profile-email">Email</label>
        <input id="profile-email" name="email" type="email" readonly>
        <label for="profile-branch">Branch</label>
        <input id="profile-branch" name="branch" type="text" maxlength="100" required>
        <label for="profile-skills">Skills</label>
        <input id="profile-skills" name="skills" type="text" maxlength="255" placeholder="javascript, sql, html">
        <p class="form-hint form-wide">Enter skills separated by commas.</p>
        <label for="profile-cgpa">CGPA</label>
        <input id="profile-cgpa" name="cgpa" type="number" min="0" max="10" step="0.01" required>
        <div class="form-actions form-wide">
          <button id="save-profile" type="submit">Save changes</button>
        </div>
      </form>
      <p id="page-message" class="message" role="status" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
