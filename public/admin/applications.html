<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Applications | College Placement Tracker</title>
  <link rel="stylesheet" href="/css/style.css">
  <script>
    if (localStorage.getItem('role') !== 'admin') {
      window.location.replace('/login.html');
    }
  </script>
  <script src="/js/api.js"></script>
</head>
<body>
  <main class="admin-shell">
    <header class="admin-header">
      <div><p class="eyebrow">College Placement Tracker</p><h1>Applications</h1></div>
      <button class="button-secondary" type="button" onclick="logout()">Log out</button>
    </header>
    <nav class="admin-nav" aria-label="Admin pages">
      <a href="/admin/dashboard.html">Dashboard</a>
      <a href="/admin/students.html">Students</a>
      <a href="/admin/companies.html">Companies</a>
      <a href="/admin/drives.html">Drives</a>
      <a href="/admin/applications.html" aria-current="page">Applications</a>
    </nav>

    <section class="content-panel">
      <div class="section-heading">
        <div><h2>All applications</h2><p class="muted">Update an application to Shortlisted, Selected, or Rejected.</p></div>
        <button id="refresh-applications" class="button-secondary" type="button">Refresh</button>
      </div>
      <p id="page-message" class="message" role="status" aria-live="polite"></p>
      <div class="table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>ID</th><th>Student</th><th>Email</th><th>Branch</th><th>CGPA</th>
              <th>Company</th><th>Drive date</th><th>Status</th><th>Change status</th>
            </tr>
          </thead>
          <tbody id="applications-table"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const applicationsTable = document.getElementById('applications-table');
    const pageMessage = document.getElementById('page-message');
    const statuses = ['Shortlisted', 'Selected', 'Rejected'];

    async function readResponse(response) {
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(data.message || 'The request could not be completed.');
      }
      return data;
    }

    function showMessage(text, isError) {
      pageMessage.textContent = text;
      pageMessage.className = isError ? 'message' : 'message success';
    }

    function addCell(row, value) {
      const cell = document.createElement('td');
      cell.textContent = value === null || value === undefined ? '' : String(value);
      row.appendChild(cell);
    }

    function formatDate(value) {
      return new Intl.DateTimeFormat(undefined, {
        year: 'numeric',
        month: 'short',
        day: 'numeric'
      }).format(new Date(value));
    }

    async function updateStatus(application, select) {
      const status = select.value;
      if (!status) {
        return;
      }

      select.disabled = true;
      try {
        const result = await readResponse(await apiFetch(
          `/api/applications/${application.applicationId}`,
          {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status })
          }
        ));
        showMessage(result.message || 'Application status updated.', false);
        await loadApplications();
      } catch (error) {
        select.value = statuses.includes(application.status) ? application.status : '';
        select.disabled = false;
        showMessage(error.message || 'Could not update the application status.', true);
      }
    }

    async function loadApplications() {
      pageMessage.textContent = '';
      try {
        const data = await readResponse(await apiFetch('/api/applications'));
        applicationsTable.replaceChildren();
        for (const application of data.applications) {
          const row = document.createElement('tr');
          addCell(row, application.applicationId);
          addCell(row, application.studentName);
          addCell(row, application.studentEmail);
          addCell(row, application.branch);
          addCell(row, application.cgpa);
          addCell(row, application.companyName);
          addCell(row, formatDate(application.driveDate));
          addCell(row, application.status);

          const statusCell = document.createElement('td');
          const select = document.createElement('select');
          select.setAttribute('aria-label', `Change status for application ${application.applicationId}`);
          select.add(new Option('Change status', ''));
          for (const status of statuses) {
            select.add(new Option(status, status));
          }
          select.value = statuses.includes(application.status) ? application.status : '';
          select.addEventListener('change', () => updateStatus(application, select));
          statusCell.appendChild(select);
          row.appendChild(statusCell);
          applicationsTable.appendChild(row);
        }
      } catch (error) {
        showMessage(error.message || 'Could not load applications.', true);
      }
    }

    document.getElementById('refresh-applications').addEventListener('click', loadApplications);
    loadApplications();
  </script>
</body>
</html>
