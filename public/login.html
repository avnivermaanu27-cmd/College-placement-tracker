<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | College Placement Tracker</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="page-shell">
    <section class="card login-card">
      <p class="eyebrow">College Placement Tracker</p>
      <h1>Welcome back</h1>
      <p class="muted">Sign in to continue to your placement dashboard.</p>

      <form id="login-form">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button id="submit-button" type="submit">Sign in</button>
        <p id="login-message" class="message" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script>
    const form = document.getElementById('login-form');
    const message = document.getElementById('login-message');
    const submitButton = document.getElementById('submit-button');
    const dashboardPaths = {
      admin: '/admin/dashboard.html',
      student: '/student/dashboard.html',
      company: '/company/dashboard.html'
    };

    form.addEventListener('submit', async event => {
      event.preventDefault();
      message.textContent = '';
      submitButton.disabled = true;

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: form.elements.email.value.trim(),
            password: form.elements.password.value
          })
        });
        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.message || 'Unable to sign in.');
        }

        const role = data.user && data.user.role;
        if (!data.token || !dashboardPaths[role]) {
          throw new Error('The server returned an invalid login response.');
        }

        localStorage.setItem('token', data.token);
        localStorage.setItem('role', role);
        window.location.assign(dashboardPaths[role]);
      } catch (error) {
        message.textContent = error.message || 'Unable to connect. Please try again.';
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
