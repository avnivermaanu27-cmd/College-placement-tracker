<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Company Dashboard | College Placement Tracker</title>
  <link rel="stylesheet" href="/css/style.css">
  <script>
    if (localStorage.getItem('role') !== 'company') {
      window.location.replace('/login.html');
    }
  </script>
  <script src="/js/api.js" defer></script>
  <script src="/company/company.js" defer></script>
</head>
<body>
  <main class="admin-shell" data-page="dashboard">
    <header class="admin-header">
      <div>
        <p class="eyebrow">College Placement Tracker</p>
        <h1><span id="company-name">Company</span> Dashboard</h1>
      </div>
      <button class="button-secondary" type="button" data-logout>Log out</button>
    </header>

    <nav class="admin-nav" aria-label="Company pages">
      <a href="/company/dashboard.html" aria-current="page">Dashboard</a>
      <a href="/company/drives.html">My drives</a>
      <a href="/company/applications.html">Applications</a>
    </nav>

    <section>
      <h2>Placement overview</h2>
      <p id="page-message" class="message" role="status" aria-live="polite"></p>
      <div class="metric-grid">
        <article class="metric-card"><h3>My drives</h3><p id="drive-count">—</p></article>
        <article class="metric-card"><h3>Applications</h3><p id="application-count">—</p></article>
      </div>
    </section>
  </main>
</body>
</html>
